<svg aria-labelledby="titulo descripcion" role="img" viewBox="0 0 860 720" xmlns="http://www.w3.org/2000/svg"><title id="titulo">Gestor del SV y condiciones de integración con el Lenguaje</title><desc id="descripcion">El Gestor administra configuraciones, permisos y fuentes. La presentación muestra los estados sin decidirlos. La relación con el Lenguaje exige tubería, contrato de frontera y admisión. La disponibilidad de las operaciones depende de la versión recibida.</desc><defs><marker id="flecha" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#08758b"></path></marker></defs><rect fill="#f3f7f9" height="720" rx="16" width="860"></rect><g fill="#14394d" font-family="Arial, sans-serif" text-anchor="middle"><text font-size="24" font-weight="700" x="430" y="43">Responsabilidades y condiciones de integración</text><rect fill="#fff" height="115" rx="10" stroke="#58859b" stroke-width="2" width="760" x="50" y="75"></rect><text font-size="23" font-weight="700" x="430" y="111">Gestor del Sistema Vectorial SV · Rust</text><text font-size="20" x="430" y="143">Dominios · asignaciones · permisos · documentos</text><text font-size="19" x="430" y="171">Decisiones y actuaciones identificadas por revisión</text><path d="M220 190 V240" fill="none" marker-end="url(#flecha)" stroke="#08758b" stroke-width="2"></path><path d="M635 190 V240" fill="none" marker-end="url(#flecha)" stroke="#08758b" stroke-width="2"></path><rect fill="#fff" height="130" rx="10" stroke="#58859b" stroke-width="2" width="340" x="50" y="245"></rect><text font-size="22" font-weight="700" x="220" y="281">Presentación</text><text font-size="19" x="220" y="312">Información autorizada</text><text font-size="19" x="220" y="340">Estado y polígono asociados</text><text font-size="17" x="220" y="362">Sin autoridad sobre el núcleo</text><rect fill="#fff" height="130" rx="10" stroke="#58859b" stroke-width="2" width="380" x="430" y="245"></rect><text font-size="22" font-weight="700" x="620" y="281">Condiciones de integración</text><text font-size="19" x="620" y="313">Identidad · revisión · permisos</text><text font-size="19" x="620" y="344">Fidelidad · procedencia · límites</text><path d="M620 375 V430 H430 V467" fill="none" marker-end="url(#flecha)" stroke="#08758b" stroke-dasharray="7 5" stroke-width="2"></path><rect fill="#e6f1f5" height="75" rx="10" stroke="#58859b" stroke-width="2" width="660" x="100" y="475"></rect><text font-size="22" font-weight="700" x="430" y="507">Tubería y contrato de frontera</text><text font-size="19" x="430" y="533">Admisión explícita de las entradas</text><path d="M430 550 V580" fill="none" marker-end="url(#flecha)" stroke="#08758b" stroke-dasharray="7 5" stroke-width="2"></path><rect fill="#fff" height="75" rx="10" stroke="#58859b" stroke-width="2" width="660" x="100" y="590"></rect><text font-size="22" font-weight="700" x="430" y="622">Lenguaje de Computación SV · Rust</text><text font-size="19" x="430" y="648">Objetos, reglas y operaciones de la versión recibida</text><text font-size="17" x="430" y="697">Trazo discontinuo: recorrido sujeto a contrato y capacidad habilitada.</text></g></svg>

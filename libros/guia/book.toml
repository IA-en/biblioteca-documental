[book]
title = "Biblioteca documental del SV"
language = "es"
src = "src"
[build]
build-dir = "../../publico"
create-missing = false
use-default-preprocessors = false
[output.html]
theme = "theme"
additional-css = ["biblioteca.css"]
additional-js = ["presentacion.js"]
mathjax-support = false
no-section-label = true
smart-punctuation = false
git-repository-url = "https://github.com/IA-en/biblioteca-documental"
[output.html.playground]
runnable = false
editable = false
copy-js = false
[output.html.search]
enable = false


